name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mlsblk:
    name: Build mlsblk
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C mlsblk mlsblk
      - name: Smoke test
        run: ./mlsblk/mlsblk --help 2>&1 || ./mlsblk/mlsblk -l 2>&1 | head -5

  lint-shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: |
          shellcheck linuxify/linuxify
          shellcheck install.sh

  linuxify-syntax:
    name: linuxify syntax check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n linuxify/linuxify
